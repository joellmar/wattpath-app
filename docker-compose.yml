services:

  # ─── Base de datos: TimescaleDB (sin puerto expuesto al host) ──────────────
  timescaledb:
    image: timescale/timescaledb-ha:pg17
    container_name: db_iot
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-wattimizer_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - iot_net

  # ─── Broker MQTT: Mosquitto (1883 expuesto para el Shelly físico) ──────────
  # DEUDA DE SEGURIDAD: el puerto 1883 es texto plano. Mitigar con TLS/8883 o
  # VPN cuando el hardware lo soporte.
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: broker_mqtt
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/password_file:/mosquitto/config/password_file:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - iot_net

  # ─── Backend: Spring Boot (solo accesible a través de Nginx) ──────────────
  backend:
    build:
      context: ./backend
    container_name: spring_backend
    restart: always
    environment:
      # Base de datos (Spring relaxed binding: SPRING_DATASOURCE_* → spring.datasource.*)
      SPRING_DATASOURCE_URL: jdbc:postgresql://timescaledb:5432/${DB_NAME:-wattimizer_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # MQTT (resuelto por nombre de servicio interno, nunca localhost)
      MQTT_URL: tcp://mosquitto:1883
      MQTT_USER: ${PROD_MQTT_USER}
      MQTT_PASSWORD: ${PROD_MQTT_PASSWORD}
      # Seguridad y autenticación
      JWT_SECRET: ${PROD_JWT_SECRET}
      ADMIN_KEY: ${PROD_ADMIN_KEY}
      # OAuth2 (Google y GitHub)
      # :- hace que Docker Compose use el valor por defecto si la variable está vacía o no definida,
      # evitando que Spring Boot 4 reciba una cadena vacía y rechace la configuración OAuth2.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy-google-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy-google-secret}
      GITHUB_CLIENT_ID: ${GH_OAUTH_CLIENT_ID:-dummy-github-id}
      GITHUB_CLIENT_SECRET: ${GH_OAUTH_CLIENT_SECRET:-dummy-github-secret}
      OAUTH2_FRONTEND_CALLBACK_URI: ${OAUTH2_FRONTEND_CALLBACK_URI:-https://wattimizer.com/auth/oauth/callback}
      # CORS: orígenes aceptados separados por coma
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://wattimizer.com,https://www.wattimizer.com}
      # true = el job genera telemetría para dispositivos is_simulated=true (modo demostración web).
      # Ponlo a false si solo quieres hardware Shelly real en producción.
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-true}
    depends_on:
      - timescaledb
      - mosquitto
    networks:
      - iot_net

  # ─── Frontend: Angular compilado (nginx interno, solo accesible en red iot) ─
  frontend:
    build:
      context: ./frontend
    container_name: angular_frontend
    restart: always
    networks:
      - iot_net

  # ─── Proxy inverso: Nginx (única puerta al exterior: 80 y 443) ────────────
  # Los certificados los gestiona Certbot nativo en el host Ubuntu.
  # El host escribe en /etc/letsencrypt y en /var/www/certbot;
  # Nginx los monta en modo lectura.
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - iot_net

networks:
  iot_net:
    driver: bridge

volumes:
  pgdata:
  mosquitto_data:
  mosquitto_log:
