server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enrutamiento SPA: si el recurso no existe como archivo físico,
    # servir index.html para que Angular Router gestione la ruta.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
