spring.application.name=jwt-auth-backend-demo

# 1. Configuración de la Base de Datos
# En Docker, SPRING_DATASOURCE_URL/USERNAME/PASSWORD del compose sobreescriben
# estos valores por binding relajado de Spring Boot. Los valores aquí son solo
# para arranque local sin Docker.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/demo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. Configuración de JPA / Hibernate
# "update" crea/actualiza tablas; los scripts SQL de /db/ añaden lo que
# Hibernate no puede generar (hypertable TimescaleDB, CHECK constraints).
spring.jpa.hibernate.ddl-auto=update
# Desactivar SQL en consola en producción; activar con SPRING_SHOW_SQL=true si se necesita depurar
spring.jpa.show-sql=${SPRING_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 3. MQTT
# En Docker, MQTT_URL del compose sobreescribe por binding relajado (MQTT_URL → mqtt.url).
# El fallback local apunta a Mosquitto corriendo de forma nativa en Windows.
mqtt.url=${MQTT_URL:tcp://localhost:1883}
mqtt.username=${MQTT_USER:gateway-service}
mqtt.password=${MQTT_PASSWORD:s3cr3t}

# 4. Seguridad
jwt.secret=${JWT_SECRET:esta_es_una_clave_temporal_de_32_bytes_desarrollo}
app.admin.secret=${ADMIN_KEY:clave_maestra_desarrollo_daw_2026}

# 5. CORS
# Lista de orígenes permitidos separados por coma.
# En producción se inyecta APP_CORS_ALLOWED_ORIGINS desde el compose.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# 6. OAuth2 Social Login (Google y GitHub)
# Fallbacks dummy para que el backend arranque en local sin credenciales reales.
# En producción, las variables de entorno reales se inyectan desde el compose.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dummy-github-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dummy-github-secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

app.oauth2.frontend-callback-uri=${OAUTH2_FRONTEND_CALLBACK_URI:http://localhost:4200/auth/oauth/callback}

# 7. Simulación IoT (solo dispositivos con is_simulated=true)
simulation.enabled=${SIMULATION_ENABLED:true}
simulation.interval-ms=${SIMULATION_INTERVAL_MS:5000}