spring.application.name=jwt-auth-backend-demo

# 1. Configuración de la Base de Datos (Supabase / PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/demo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. Configuración de JPA / Hibernate
# "update" intenta actualizar la BD (crear las tablas si no existen), si cambias el código Java (útil en desarrollo) pero NO crea hipertablas automáticamente
# "validate" solo comprueba que coincidan (más seguro si ya tienes el SQL hecho)
# Cambiamos a 'update' para no borrar las tablas de Supabase
spring.jpa.hibernate.ddl-auto=update
# Mostrar las consultas SQL en la consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.default_schema=auth_angular_spring_demo

# Dialecto (opcional en versiones nuevas, pero bueno para asegurar)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

mqtt.url=tcp://localhost:1883
mqtt.username=${MQTT_USER:gateway-service}
mqtt.password=${MQTT_PASSWORD:s3cr3t}


jwt.secret=${JWT_SECRET:esta_es_una_clave_temporal_de_32_bytes_desarrollo}

app.admin.secret=${ADMIN_KEY:clave_maestra_desarrollo_daw_2026}

# -------------------------------------------------------
# OAuth2 Social Login (Google y GitHub)
# Fallbacks dummy para que el backend arranque en local
# sin credenciales reales configuradas en el SO.
# En producción, establecer las variables de entorno reales.
# -------------------------------------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dummy-github-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dummy-github-secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

app.oauth2.frontend-callback-uri=${OAUTH2_FRONTEND_CALLBACK_URI:http://localhost:4200/auth/oauth/callback}