# Autenticación obligatoria: sin credenciales no hay conexión
allow_anonymous false
password_file /mosquitto/config/password_file

# Puerto estándar MQTT (texto plano).
# DEUDA DE SEGURIDAD: migrar a 8883/TLS cuando el hardware Shelly lo soporte.
listener 1883 0.0.0.0

# Persistencia de mensajes y estado de suscripciones entre reinicios
persistence true
persistence_location /mosquitto/data/

# Registro de eventos (volumen nombrado mosquitto_log en Docker)
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_level warning
connection_messages true
