# ─── Resolver DNS interno de Docker (refresca cada 30 s) ──────────────────────
# Sin esto, Nginx cachea la IP del upstream en el arranque y no la actualiza
# cuando un contenedor se reinicia y cambia de IP dentro de la red Docker.
resolver 127.0.0.11 valid=30s ipv6=off;

# ─── Upstreams internos ────────────────────────────────────────────────────────
upstream backend {
    server backend:8080;
}

upstream frontend {
    server frontend:80;
}

# ─── 1. Redirección HTTP → HTTPS (todos los dominios) ──────────────────────────
server {
    listen 80;
    server_name wattimizer.com www.wattimizer.com api.wattimizer.com;
    server_tokens off;

    # Certbot webroot: el agente nativo del host escribe aquí los desafíos ACME.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── 2. Dominio principal: wattimizer.com / www (Nube Naranja en Cloudflare) ───
# Sirve el SPA Angular y proxya la API y los WebSockets.
# Los heartbeats STOMP cada 20 s mantienen la conexión viva a través del proxy
# de Cloudflare sin necesitar tiempos de inactividad irracionales.
server {
    listen 443 ssl;
    server_name wattimizer.com www.wattimizer.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/wattimizer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wattimizer.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options        "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options "nosniff"                      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # SPA Angular (el contenedor frontend maneja el try_files /index.html)
    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # REST API de Spring Boot
    location /api/ {
        proxy_pass         http://backend/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Inicio del flujo OAuth2 (redirect al proveedor)
    location /oauth2/ {
        proxy_pass         http://backend/oauth2/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Callback OAuth2 (Spring Security recibe el code del proveedor)
    location /login/oauth2/ {
        proxy_pass         http://backend/login/oauth2/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # WebSocket STOMP de telemetría en tiempo real
    location /ws-iot {
        proxy_pass             http://backend;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        "Upgrade";
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        # 24 h: evita que Nginx corte la conexión por inactividad aparente
        proxy_read_timeout     86400;
        proxy_send_timeout     86400;
    }
}

# ─── 3. Subdominio API: api.wattimizer.com (Nube Gris en Cloudflare) ───────────
# Sin proxy de Cloudflare → WebSocket y flujos de telemetría no se ven afectados
# por el timeout de inactividad del proxy CDN (100 s en plan gratuito).
# Úsalo cuando necesites conexiones WebSocket estables de larga duración
# o acceso externo directo a la API (Postman, dispositivos no-Shelly, etc.).
server {
    listen 443 ssl;
    server_name api.wattimizer.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/wattimizer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wattimizer.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options        "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options "nosniff"                      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass         http://backend/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /oauth2/ {
        proxy_pass         http://backend/oauth2/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/ {
        proxy_pass         http://backend/login/oauth2/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /ws-iot {
        proxy_pass             http://backend;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        "Upgrade";
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400;
        proxy_send_timeout     86400;
    }
}
