name: CI / Deploy to Hetzner VPS

# Solo en push directo a main (no en pull_request para evitar despliegues
# accidentales de ramas que aún no han sido revisadas).
on:
  push:
    branches:
      - main

jobs:

  # ─── Job 1: Validar compilación del Frontend ──────────────────────────────
  validate-frontend:
    name: Build Angular (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Compilar Angular en modo producción
        working-directory: frontend
        run: npm run build -- --configuration=production

  # ─── Job 2: Validar compilación del Backend ───────────────────────────────
  validate-backend:
    name: Package Spring Boot (skip tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar y empaquetar (sin tests de integración que requieren BD)
        working-directory: backend
        run: ./mvnw -DskipTests --no-transfer-progress clean package

  # ─── Job 3: Desplegar en el VPS de Hetzner ────────────────────────────────
  # Solo se ejecuta si los dos jobs de validación anteriores pasaron.
  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest
    needs: [validate-frontend, validate-backend]
    steps:
      - name: SSH — actualizar código y reiniciar servicios
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /root/wattimizer-app

            # Sincronizar el código con la rama main remota.
            # --ff-only asegura que no haya divergencia; si la hay, el deploy falla limpiamente.
            git fetch origin main
            git reset --hard origin/main

            # Regenerar .env con todos los secretos de producción.
            # Cada echo es una línea; las comillas simples evitan expansión del shell.
            {
              echo "DB_NAME=${{ secrets.DB_NAME }}"
              echo "DB_USER=${{ secrets.DB_USER }}"
              echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}"
              echo "PROD_MQTT_USER=${{ secrets.PROD_MQTT_USER }}"
              echo "PROD_MQTT_PASSWORD=${{ secrets.PROD_MQTT_PASSWORD }}"
              echo "PROD_JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}"
              echo "PROD_ADMIN_KEY=${{ secrets.PROD_ADMIN_KEY }}"
              echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"
              echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"
              echo "GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }}"
              echo "GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }}"
              echo "OAUTH2_FRONTEND_CALLBACK_URI=${{ secrets.OAUTH2_FRONTEND_CALLBACK_URI }}"
              echo "APP_CORS_ALLOWED_ORIGINS=${{ secrets.APP_CORS_ALLOWED_ORIGINS }}"
            } > .env
            chmod 600 .env

            # Reconstruir solo los contenedores cuya imagen ha cambiado.
            docker compose --env-file .env up -d --build

            # Eliminar imágenes sin etiqueta que ya no usa ningún contenedor.
            docker image prune -f
